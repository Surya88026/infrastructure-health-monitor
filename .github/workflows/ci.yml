
name: Go CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build -v ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"
